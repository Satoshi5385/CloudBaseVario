name: Build firmware

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: espressif/idf:v6.0.2

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Trust checked-out repository
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run Python tests
        run: bash ci/run_ci.sh python-tests

      - name: Check Python tools
        run: bash ci/run_ci.sh python-compile

      - name: Configure ESP32-S3 target
        run: bash ci/run_ci.sh configure

      - name: Build and run host C tests
        run: bash ci/run_ci.sh host-c

      - name: Build firmware
        run: bash ci/run_ci.sh firmware

      - name: Verify effective watchdog configuration
        run: bash ci/run_ci.sh configuration
