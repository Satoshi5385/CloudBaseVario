name: Build firmware

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: espressif/idf:v6.0.2

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure ESP32-S3 target
        run: idf.py set-target esp32s3

      - name: Build firmware
        run: idf.py build
